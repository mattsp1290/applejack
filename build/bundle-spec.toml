# The typed spec `cargo xtask engine-payload --write-bundle-toml` renders into
# the payload's BUNDLE.toml and THIRD_PARTY_NOTICES.md (build/assemble.sh runs
# it). Same shape as BUNDLE.toml; the engine crate's reader parses the result.
# Versions and licenses follow build/pins.toml; paths follow the layout
# build/assemble.sh produces. The gate results (`wow64`, `sync_modes`,
# `[d3dmetal]`) are hand-entered from docs/engines/payload-build.md.

id = "rosetta-wine"
# Bundle version: Wine version, then the bundle revision. Directory name under
# engines/rosetta-wine/, so lowercase [0-9a-z._+-] starting with a digit.
version = "11.0-1"
arch = "x86_64"
# MACOSX_DEPLOYMENT_TARGET in build/wine/build.sh.
min_macos = "14.0"
# Gate G4b: neither msync patch applies to wine-11.0, so esync is the default.
sync_modes = ["esync", "none"]

[wine]
version = "11.0"
source_url = "https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz"
source_rev = "wine-11.0"
loader = "wine/bin/wine"
server = "wine/bin/wineserver"
# Wine 10+ on Xcode 15.3+ needs no preloader; `preloader` stays absent.
# configure --enable-archs=i386,x86_64 builds upstream's new WoW64. Gate G4e
# confirms 32-bit code runs before this value is trusted.
wow64 = "new"

[components]
dxmt = { version = "0.80", license = "MIT" }
vkd3d_proton = { version = "3.1", license = "LGPL-2.1-or-later" }
moltenvk = { version = "1.4.2", license = "Apache-2.0" }
# kosmickrisp: no x86-64 build is pinned (plan 03 step 4); omitted.
gstreamer = { version = "1.28.8", license = "LGPL-2.1-or-later" }
osslsigncode = { version = "2.14", license = "GPL-3.0-or-later" }
# The x86-64 Homebrew libraries `cargo xtask engine-payload --close` copies
# into wine/lib/ (docs/engines/payload-build.md step 7), one row per formula,
# keyed by formula name (a versioned formula is a quoted key, "openssl@3").
# The closure refuses to copy a file whose Cellar path
# (/usr/local/Cellar/<formula>/<version>/) has no row with that version, so
# the Cellar is the source of these versions. Each license is the shipped
# library's own: gnutls and gettext ship GPL-3.0 tools that are not copied;
# libidn2's formula expression also lists GPL-3.0-or-later (the idn2 tool,
# not copied), LGPL-2.1-or-later (gnulib sources, subsumed by the LGPL-3.0
# option exercised here), Unicode-TOU and FSFAP (not distribution terms).
# Where a license is an `OR` expression the notices state the option this
# bundle exercises, LGPL-3.0-or-later (`EXERCISED_OPTION` in
# xtask/src/bundle_toml.rs), which every such row must offer.
#   gnutls:       libgnutls.30.dylib (Wine dlopens it: bcrypt, crypt32, secur32)
#   p11-kit:      libp11-kit.0.dylib (gnutls)
#   libidn2:      libidn2.0.dylib (gnutls)
#   libunistring: libunistring.5.dylib (gnutls, libidn2)
#   libtasn1:     libtasn1.6.dylib (gnutls)
#   nettle:       libnettle.8.dylib, libhogweed.6.dylib (gnutls)
#   gmp:          libgmp.10.dylib (gnutls, hogweed)
#   sdl2:         libSDL2-2.0.0.dylib (Wine dlopens it: winebus)
# Not rows, because the payload already ships them and dyld keeps one image
# per install name: freetype (Wine dlopens libfreetype.6.dylib; wine/lib/
# holds a link to the GStreamer framework's copy, under the `gstreamer` row),
# gettext's libintl.8.dylib (gnutls and libidn2 reach the framework's copy
# through a run path), and molten-vk (Wine's libMoltenVK.dylib is a link to
# the pinned MoltenVK under vulkan/, the `moltenvk` row above, and so is the
# framework's copy).
gnutls = { version = "3.8.10", license = "LGPL-2.1-or-later" }
p11-kit = { version = "0.25.5", license = "BSD-3-Clause" }
libidn2 = { version = "2.3.8", license = "(GPL-2.0-or-later OR LGPL-3.0-or-later) AND Unicode-DFS-2016" }
libunistring = { version = "1.3", license = "GPL-2.0-or-later OR LGPL-3.0-or-later" }
libtasn1 = { version = "4.20.0", license = "LGPL-2.1-or-later" }
nettle = { version = "3.10.2", license = "GPL-2.0-or-later OR LGPL-3.0-or-later" }
gmp = { version = "6.3.0", license = "LGPL-3.0-or-later OR GPL-2.0-or-later" }
sdl2 = { version = "2.32.8", license = "Zlib" }

# Bundle-relative DLL paths per Windows architecture; the installer copies
# each into the prefix and overrides its stem. winemetal.dll is DXMT's bridge
# to wine/lib/wine/x86_64-unix/winemetal.so; nvapi64.dll and nvngx.dll are
# optional and not shipped.
[overrides.dxmt]
x86_64 = [
  "dxmt/x86_64-windows/d3d11.dll",
  "dxmt/x86_64-windows/dxgi.dll",
  "dxmt/x86_64-windows/d3d10core.dll",
  "dxmt/x86_64-windows/winemetal.dll",
]
i386 = [
  "dxmt/i386-windows/d3d11.dll",
  "dxmt/i386-windows/dxgi.dll",
  "dxmt/i386-windows/d3d10core.dll",
  "dxmt/i386-windows/winemetal.dll",
]

[overrides.vkd3d]
x86_64 = ["vkd3d/x64/d3d12.dll", "vkd3d/x64/d3d12core.dll"]
i386 = ["vkd3d/x86/d3d12.dll", "vkd3d/x86/d3d12core.dll"]

# Gate G4d (D3DMetal loads in this Wine build) has not run. Its presence
# advertises the D3DMetal backend, so the table stays out until G4d passes:
# [d3dmetal]
# overlay_dir = "wine/lib/external"

[probes]
cpuid = "probes/cpuid"
dx11_sample = "probes/dx11-sample.exe"
xinput_check = "probes/xinput-check.exe"

[registry]
# dlls/winebus.sys/main.c, check_bus_option, at wine-11.0.
hidraw_key = 'HKLM\System\CurrentControlSet\Services\WineBus\DisableHidraw'
