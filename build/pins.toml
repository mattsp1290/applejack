# Every input of the Rosetta engine payload build, pinned by HTTPS URL and
# SHA-256. `cargo xtask engine-payload --fetch` downloads each `dest` under
# build/work/, verifies it, and scans its listing against build/denylist.toml
# before any script extracts it; `cargo xtask pins-verify` parses this file
# offline. Hashes were computed from the downloaded files on 2026-10-28; each
# pin's `# verified:` line says what cross-checked that hash: an upstream
# digest, or TOFU (trust on first use, no published digest to compare with).
# `kind` is "source", "release-asset", or "toolchain". Each `dest` is unique.
#
# GitHub `/archive/` tarballs (wine-msync, osslsigncode) are generated on
# demand and their bytes are not guaranteed stable (the 2023 gzip change
# altered them once). A change breaks `--fetch` with a hash mismatch and ships
# nothing; `--fetch` re-verifies every present archive on each run. If it
# happens, mirror the verified archive as a release asset under our control
# and repoint the pin.

# WineHQ stable 11.0 (ADR-0010, gate G4a Option A). The sha256 here matches the
# tarball whose sha512 is listed in https://dl.winehq.org/wine/source/11.0/sha512sums.asc.
# verified: upstream sha512sums.asc (the sha512 of the same bytes), 2026-10-28
[[pin]]
id = "wine"
kind = "source"
url = "https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz"
sha256 = "c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701"
version = "11.0"
license = "LGPL-2.1-or-later"
dest = "wine/wine-11.0.tar.xz"

