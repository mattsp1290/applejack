# Upstream GStreamer runtime package for macOS. Since 1.22 upstream ships one
# universal (arm64 + x86_64) package; the x86_64 slices are what the payload uses.
# The product archive also carries GPL and patent-restricted sub-packages
# (codecs-gpl, codecs-gpl-restricted, codecs-restricted, net-restricted,
# dvd-gpl, libav). build/gstreamer/fetch.sh stages only the allowlisted
# LGPL/MIT/BSD/Apache sub-packages, which is what `license` describes; the
# payload-scoped rules in build/denylist.toml reject the rest.
